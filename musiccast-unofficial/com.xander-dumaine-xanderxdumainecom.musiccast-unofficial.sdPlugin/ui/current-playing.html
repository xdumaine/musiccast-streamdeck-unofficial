<!DOCTYPE html>
<html>

<head lang="en">
	<title>MusicCast now playing</title>
	<meta charset="utf-8" />
	<script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
	<script src="shared-color-fields.js" defer></script>
</head>

<body>
	<sdpi-item label="Device IP / host">
		<sdpi-textfield setting="host" placeholder="192.168.1.42" global></sdpi-textfield>
	</sdpi-item>
	<sdpi-item label="Zone (optional)">
		<sdpi-textfield setting="zone" placeholder="main" default="main" global></sdpi-textfield>
	</sdpi-item>
	<sdpi-item label="Poll interval">
		<sdpi-range setting="pollSeconds" min="5" max="120" step="1" default="10" showlabels="true"></sdpi-range>
	</sdpi-item>
	<sdpi-item label="Show album art">
		<sdpi-checkbox setting="showAlbumArt" default="true"></sdpi-checkbox>
	</sdpi-item>
	<sdpi-item label="">
		<details>
			<summary>Shared colors</summary>
			<sdpi-item label="Primary / accent">
				<sdpi-color setting="colors.level" default="#5AC8FA" global></sdpi-color>
			</sdpi-item>
			<sdpi-item label="Text">
				<sdpi-color setting="colors.number" default="#FFFFFF" global></sdpi-color>
			</sdpi-item>
			<sdpi-item label="Key background">
				<input data-global-color="background" placeholder="transparent or #1C1C1E" style="width:100%;" />
			</sdpi-item>
			<sdpi-item label="Subtitle">
				<sdpi-color setting="colors.subtitle" default="#8E8E93" global></sdpi-color>
			</sdpi-item>
			<sdpi-item label="Bar track (empty)">
				<input data-global-color="barTrack" placeholder="transparent or #3A3A3C" style="width:100%;" />
			</sdpi-item>
		</details>
	</sdpi-item>
	<sdpi-item label="">
		<details>
			<summary>Help</summary>
			<p style="font-size:12px;opacity:0.9;margin-top:8px;">
				Displays <code>netusb/getPlayInfo</code> song/title, artist/album, progress, source, playback state, and album art when enabled and <code>albumart_url</code> is available.
				Push, touch, or rotate the dial to refresh immediately.
			</p>
		</details>
	</sdpi-item>
</body>

</html>
